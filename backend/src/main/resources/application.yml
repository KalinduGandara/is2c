spring:
  application:
    name: hrm
  datasource:
    url: ${HRM_DB_URL:jdbc:postgresql://localhost:5432/hrm}
    username: ${HRM_DB_USER:hrm}
    password: ${HRM_DB_PASSWORD:hrm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    locations: classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  messages:
    basename: messages
    encoding: UTF-8
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

hrm:
  edition: ${HRM_EDITION:ONPREM}
  db:
    vendor: ${HRM_DB_VENDOR:postgresql}
  jwt:
    secret: ${HRM_JWT_SECRET:}
  storage:
    path: ${HRM_STORAGE_PATH:data/files}
  mail:
    enabled: ${HRM_MAIL_ENABLED:false}
    from: ${HRM_MAIL_FROM:hrm@localhost}
  cors:
    origins: ${HRM_CORS_ORIGINS:}
  admin:
    username: ${HRM_ADMIN_USERNAME:}
    password: ${HRM_ADMIN_PASSWORD:}
  api-docs: ${HRM_API_DOCS:false}
