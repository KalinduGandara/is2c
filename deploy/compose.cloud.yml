# Cloud edition: same image; Caddy obtains a public certificate (Let's Encrypt) for HRM_DOMAIN and sends HSTS.
#   cp deploy/.env.example deploy/.env   # then edit the secrets
#   docker compose -f deploy/compose.cloud.yml up -d --build
name: hrm-cloud

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrm
      POSTGRES_USER: hrm
      POSTGRES_PASSWORD: ${HRM_DB_PASSWORD:?set HRM_DB_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrm -d hrm"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${HRM_IMAGE:-is2c/hrm:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HRM_EDITION: CLOUD
      HRM_DB_URL: jdbc:postgresql://db:5432/hrm
      HRM_DB_USER: hrm
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HRM_HTTP_PORT:-80}:80"
      - "${HRM_HTTPS_PORT:-443}:443"
    environment:
      HRM_DOMAIN: ${HRM_DOMAIN:?set HRM_DOMAIN in deploy/.env}
      HRM_ACME_EMAIL: ${HRM_ACME_EMAIL:-}
    volumes:
      - ./Caddyfile.cloud:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: hrm
      PGDATABASE: hrm
      PGPASSWORD: ${HRM_DB_PASSWORD}
      HRM_BACKUP_RETENTION_DAYS: ${HRM_BACKUP_RETENTION_DAYS:-14}
      HRM_BACKUP_AT: ${HRM_BACKUP_AT:-02:00}
      TZ: ${TZ:-Asia/Colombo}
    volumes:
      - ./backup:/scripts:ro
      - ${HRM_BACKUP_DIR:-./backups}:/backups
      - files:/files
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  files:
  caddy-data:
  caddy-config:
